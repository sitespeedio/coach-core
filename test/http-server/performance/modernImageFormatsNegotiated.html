<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Modern image formats - Accept negotiated</title>
  </head>
  <body>
    <!-- .jpg URL, but a .webp sibling exists and the browser sends
         Accept: image/webp, so the response is image/webp. Nothing to fix. -->
    <img src="img/negotiated.jpg" alt="negotiated" />
  </body>
</html>
